<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnScroll</title>
<style>
  :root {
    --bg: #0b0d12; --card: #141821; --ink: #f2f4f8; --dim: #9aa3b2; --line: #262c3a;
    --electronics: #f5b942; --economics: #4fd1a5; --history: #e58a6b; --poetry: #b79cf5; --books: #6fb6f5; --video: #f56f8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: 10px 12px 8px;
    background: linear-gradient(var(--bg) 70%, transparent); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; opacity: .45; }
  .chip.on { opacity: 1; border-color: var(--c); color: var(--c); }
  .chip.tool { opacity: 1; color: var(--dim); }
  #feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .card { height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column; justify-content: center;
    padding: 64px 22px 40px; max-width: 560px; margin: 0 auto; }
  .tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); margin-bottom: 12px; }
  .tag span { color: var(--dim); }
  h2 { font-size: clamp(24px, 6vw, 32px); line-height: 1.15; margin: 0 0 16px; text-wrap: balance; }
  p { font-size: 17px; line-height: 1.55; margin: 0 0 12px; color: #d9dde6; }
  .check { font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 8px; }
  .poem { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.6; white-space: pre-line; color: var(--ink); }
  .by { color: var(--dim); font-size: 14px; margin-top: 10px; }
  .opts { display: grid; gap: 8px; margin-top: 4px; }
  .opt { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; font-size: 16px; cursor: pointer; }
  .opt.right { border-color: var(--economics); color: var(--economics); }
  .opt.wrong { border-color: var(--video); color: var(--video); }
  .why { margin-top: 12px; display: none; }
  .answered .why { display: block; }
  .frame { width: 100%; aspect-ratio: 9/14; max-height: 62dvh; background: #000; border-radius: 14px; overflow: hidden; }
  .frame.wide { aspect-ratio: 16/9; }
  .frame iframe { width: 100%; height: 100%; border: 0; }
  .vtitle { font-size: 15px; color: var(--dim); margin-top: 10px; }
  .end { text-align: center; }
  dialog { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 16px;
    width: min(92vw, 460px); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 12px; }
  dialog label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 4px; }
  dialog input, dialog select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  dialog .row { display: flex; gap: 8px; margin-top: 16px; }
  dialog button { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; }
  dialog button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.4; }
  #msg { font-size: 13px; color: var(--electronics); min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<header><div class="chips" id="chips"></div></header>
<main id="feed"></main>

<dialog id="dlg">
  <h3>Add videos</h3>
  <label>Paste a YouTube link (video or Short)</label>
  <input id="url" placeholder="https://www.youtube.com/shorts/…">
  <label>Topic</label>
  <select id="vtopic"></select>
  <div class="row"><button id="addBtn" class="primary">Add to feed</button></div>
  <label>Optional: YouTube Data API key — pulls recent Shorts from the vetted channel list</label>
  <input id="key" placeholder="AIza…">
  <div class="row"><button id="fetchBtn">Fetch from vetted channels</button><button id="closeBtn">Close</button></div>
  <div id="msg"></div>
  <div class="note">Videos are embedded with YouTube's official player — nothing is downloaded or re-hosted. The key stays in this browser only.</div>
</dialog>

<script>
const TOPICS = {
  electronics: 'Electronics & robotics', economics: 'Economics', history: 'History', poetry: 'Poetry', books: 'Books'
};

// Each topic is an ordered ladder: cards appear in this order within their topic.
// type: lesson | quiz | poem. "check" tells the reader where to verify the claim.
const CARDS = [
  // ── Electronics & robotics ──
  { t:'electronics', title:'What electricity actually is',
    body:['Matter is full of charged particles. In a metal wire, some electrons are free to drift.','<b>Current</b> is how much charge passes a point each second. 1 ampere = 1 coulomb per second.'],
    check:'Any intro physics text, chapter on electric current.' },
  { t:'electronics', title:'Voltage is the push',
    body:['Charge only flows if something pushes it. <b>Voltage</b> is that push: energy per unit of charge (1 volt = 1 joule per coulomb).','Water analogy: voltage is pressure, current is flow rate. It is an analogy, not the physics — but it gets you far.'],
    check:'Khan Academy: "Voltage" in the circuits unit.' },
  { t:'electronics', title:'Ohm\'s law: V = I × R',
    body:['<b>Resistance</b> is how hard a component fights the flow, in ohms (Ω).','Double the voltage across a resistor and the current doubles. Double the resistance and the current halves.'],
    check:'Measure it yourself: battery, resistor, multimeter.' },
  { t:'electronics', type:'quiz', q:'A 9 V battery across a 450 Ω resistor. How much current flows?',
    opts:['20 mA','50 mA','4.05 A'], a:0, why:'I = V / R = 9 / 450 = 0.02 A = 20 mA.' },
  { t:'electronics', title:'Why an LED needs a resistor',
    body:['An LED barely limits its own current. Connect it straight to 5 V and it burns out.','Pick the resistor with <b>R = (V<sub>supply</sub> − V<sub>LED</sub>) / I</b>. For 5 V, a red LED (~2 V) and 15 mA: (5 − 2) / 0.015 = 200 Ω.'],
    check:'The LED\'s datasheet lists forward voltage and max current.' },
  { t:'electronics', title:'Power: P = V × I',
    body:['Power is how fast energy is used, in watts. A motor drawing 0.5 A at 6 V uses 3 W.','This is why thin wires and tiny chips get hot: the power has to go somewhere.'],
    check:'Any intro circuits text, "electrical power".' },
  { t:'electronics', title:'A transistor is a switch you control with electricity',
    body:['A microcontroller pin can supply only about 20 mA. A small motor wants hundreds.','A transistor (often a MOSFET) lets that tiny signal switch a big current on and off — a valve operated by a finger.'],
    check:'Arduino Uno docs: 20 mA recommended per I/O pin.' },
  { t:'electronics', title:'The H-bridge: how a robot reverses',
    body:['Four switches around a motor, drawn like the letter H. Close one diagonal pair and current flows one way; close the other pair and it reverses.','Chips like the TB6612 or L298N are H-bridges in a package. Every sumo robot has one.'],
    check:'TB6612FNG datasheet, block diagram.' },
  { t:'electronics', title:'PWM: speed control by blinking fast',
    body:['Switch the motor fully on and off thousands of times a second. The motor averages it out.','<b>Duty cycle</b> is the fraction of time it is on. 50% duty ≈ half the average voltage ≈ slower motor.'],
    check:'Arduino reference: analogWrite().' },
  { t:'electronics', type:'quiz', q:'Your robot must spin its left wheel backwards. Which part makes that possible?',
    opts:['A bigger battery','An H-bridge','A pull-up resistor'], a:1, why:'Reversing a DC motor means reversing current through it — exactly what an H-bridge does.' },
  { t:'electronics', title:'Sense → think → act',
    body:['Every robot runs this loop. <b>Sense:</b> an infrared sensor sees the white edge of the ring. <b>Think:</b> code decides "back up". <b>Act:</b> motors reverse.','The loop runs hundreds of times a second. Robotics is mostly making each of the three steps reliable.'],
    check:'Build it: one sensor, one if-statement, one motor.' },
  { t:'electronics', title:'Your build order',
    body:['1. Blink an LED. 2. Read a button. 3. Drive one motor through an H-bridge. 4. Read one sensor. 5. Combine them.','Do not skip to step 5. Each step isolates one thing that can go wrong.'],
    check:'This is advice, not a fact — but ask anyone who has debugged a robot.' },

  // ── Economics ──
  { t:'economics', title:'Opportunity cost',
    body:['The real cost of anything is the best alternative you gave up for it.','An hour of scrolling does not cost zero. It costs whatever else that hour could have been.'],
    check:'Mankiw, Principles of Economics, ch. 1.' },
  { t:'economics', title:'GDP in one sentence',
    body:['The market value of all <b>final</b> goods and services produced inside a country in a given period.','"Final" matters: the flour sold to a bakery is not counted separately from the bread, or it would be counted twice.'],
    check:'IMF or your national statistics office: "What is GDP?"' },
  { t:'economics', title:'Inflation',
    body:['A sustained rise in the general price level — not one price going up, but most of them.','At 2% a year, prices double in about 35 years. Rule of 70: years to double ≈ 70 ÷ growth rate.'],
    check:'1.02^35 ≈ 2.0. Try it on a calculator.' },
  { t:'economics', title:'Nominal vs real',
    body:['<b>Nominal</b> is the number on the label. <b>Real</b> is adjusted for inflation.','A savings account paying 4% while prices rise 6% has a real return of about −2%. You have more money and less buying power.'],
    check:'The Fisher approximation: real ≈ nominal − inflation.' },
  { t:'economics', type:'quiz', q:'Money growing at 6% a year doubles in roughly…',
    opts:['6 years','12 years','20 years'], a:1, why:'Rule of 72: 72 ÷ 6 = 12 years. (1.06^12 ≈ 2.01.)' },
  { t:'economics', title:'What a central bank does',
    body:['It sets the price of short-term borrowing. Higher rates make loans costlier, so people and firms spend less, which cools inflation.','It works with a lag of many months, and economists genuinely disagree about how long. That is why rate decisions are arguments, not calculations.'],
    check:'Your central bank\'s own "monetary policy explained" page.' },
  { t:'economics', title:'Comparative advantage',
    body:['Two parties can both gain from trade even if one is better at everything.','What matters is not who is best, but who gives up the least to make each thing. Specialise where your opportunity cost is lowest.'],
    check:'David Ricardo, 1817. Worked example in any intro text.' },

  // ── History ──
  { t:'history', title:'c. 1450 — the printing press',
    body:['Gutenberg\'s movable-type press in Mainz made books cheap enough to spread widely.','Within decades, millions of volumes were in circulation in Europe. Ideas could now outrun the people trying to control them.'],
    check:'Eisenstein, The Printing Press as an Agent of Change.' },
  { t:'history', title:'c. 1760 — the Industrial Revolution',
    body:['Starting in Britain, production moved from hands and homes to machines and factories, driven by coal and steam.','Why Britain first is still debated: cheap coal, high wages, institutions, empire. Be suspicious of anyone with a one-word answer.'],
    check:'Robert Allen, The British Industrial Revolution in Global Perspective.' },
  { t:'history', title:'1929 — the crash and the Depression',
    body:['The US stock market collapsed in October 1929. By 1933 about a quarter of American workers were unemployed.','The crash did not cause the Depression alone — bank failures and a shrinking money supply turned a recession into a catastrophe.'],
    check:'US Bureau of Labor Statistics historical series; Friedman & Schwartz.' },
  { t:'history', title:'1944 — Bretton Woods',
    body:['44 Allied nations agreed to peg their currencies to the US dollar, and the dollar to gold at $35 an ounce.','The system ended in 1971 when the US stopped converting dollars to gold. Most currencies have floated since.'],
    check:'IMF history pages; Federal Reserve History, "Nixon ends convertibility".' },
  { t:'history', title:'1947 — the transistor',
    body:['Bardeen, Brattain and Shockley at Bell Labs built a solid-state switch to replace fragile vacuum tubes.','Everything digital is made of them. A modern phone chip holds billions.'],
    check:'Nobel Prize in Physics 1956.' },
  { t:'history', type:'quiz', q:'What ended in 1971?',
    opts:['The gold convertibility of the US dollar','The Great Depression','The Industrial Revolution'], a:0, why:'The US suspended converting dollars to gold, ending the Bretton Woods system.' },

  // ── Poetry (public domain) ──
  { t:'poetry', type:'poem', text:'“Hope” is the thing with feathers —\nThat perches in the soul —\nAnd sings the tune without the words —\nAnd never stops — at all —', by:'Emily Dickinson, c. 1861' },
  { t:'poetry', type:'poem', text:'Caminante, son tus huellas\nel camino y nada más;\nCaminante, no hay camino,\nse hace camino al andar.', by:'Antonio Machado, Proverbios y cantares, 1912' },
  { t:'poetry', type:'poem', text:'“My name is Ozymandias, King of Kings;\nLook on my Works, ye Mighty, and despair!”\nNothing beside remains. Round the decay\nOf that colossal Wreck, boundless and bare\nThe lone and level sands stretch far away.', by:'Percy Bysshe Shelley, Ozymandias, 1818' },
  { t:'poetry', type:'poem', text:'¿Qué es poesía?, dices mientras clavas\nen mi pupila tu pupila azul.\n¿Qué es poesía? ¿Y tú me lo preguntas?\nPoesía… eres tú.', by:'Gustavo Adolfo Bécquer, Rima XXI' },
  { t:'poetry', type:'poem', text:'I shall be telling this with a sigh\nSomewhere ages and ages hence:\nTwo roads diverged in a wood, and I —\nI took the one less traveled by,\nAnd that has made all the difference.', by:'Robert Frost, The Road Not Taken, 1916' },

  // ── Books ──
  { t:'books', title:'Make: Electronics — Charles Platt',
    body:['Learn by burning things out on purpose. Each chapter is an experiment first and an explanation second.','Good first book if you have never touched a breadboard.'],
    check:'A recommendation, not a fact. Skim chapter 1 before buying.' },
  { t:'books', title:'The Worldly Philosophers — Robert Heilbroner',
    body:['Economics told as the story of the people who invented it: Smith, Marx, Keynes and the rest.','Gives you the arguments before the equations, which is the right order.'],
    check:'A recommendation, not a fact.' },
];

// Channels to pull Shorts from when an API key is supplied. Editorial whitelist = the misinformation filter.
// Handles are best-effort; any that fail to resolve are skipped.
const CHANNELS = [
  { h:'ElectroBOOM', t:'electronics' }, { h:'GreatScottLab', t:'electronics' }, { h:'EEVblog', t:'electronics' },
  { h:'khanacademy', t:'economics' }, { h:'crashcourse', t:'history' }, { h:'TEDEd', t:'history' },
  { h:'veritasium', t:'electronics' }, { h:'3blue1brown', t:'electronics' },
];

const store = {
  get(k, d) { try { const v = localStorage.getItem('ls.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ls.' + k, JSON.stringify(v)); } catch {} },
};
let enabled = store.get('topics', Object.keys(TOPICS));
let seen = new Set(store.get('seen', []));
let videos = store.get('videos', []);   // { id, t, title, short }
const $ = (s) => document.querySelector(s);
const feed = $('#feed');

function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|\/shorts\/|\/embed\/|[?&]v=)([\w-]{11})/);
  return m ? { id: m[1], short: /\/shorts\//.test(url) } : null;
}

function buildQueue() {
  // One ordered ladder per topic; unseen cards first, then round-robin across topics.
  const ladders = enabled.map((t) => {
    const own = CARDS.map((c, i) => ({ ...c, key: 'c' + i })).filter((c) => c.t === t);
    const vids = videos.filter((v) => v.t === t).map((v) => ({ ...v, type: 'video', key: 'v' + v.id }));
    // weave a video in after every 3rd card
    const out = []; let vi = 0;
    own.forEach((c, i) => { out.push(c); if (i % 3 === 2 && vi < vids.length) out.push(vids[vi++]); });
    out.push(...vids.slice(vi));
    return [...out.filter((c) => !seen.has(c.key)), ...out.filter((c) => seen.has(c.key))];
  });
  const q = [];
  for (let i = 0; ladders.some((l) => i < l.length); i++) ladders.forEach((l) => { if (i < l.length) q.push(l[i]); });
  return q;
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

function cardHtml(c) {
  const type = c.type || 'lesson';
  const total = CARDS.filter((x) => x.t === c.t).length;
  const pos = CARDS.filter((x, i) => x.t === c.t && i <= +c.key.slice(1)).length;
  const tag = `<div class="tag">${TOPICS[c.t]} <span>· ${type === 'video' ? 'video' : pos + ' of ' + total}</span></div>`;
  if (type === 'poem') return tag + `<div class="poem">${esc(c.text)}</div><div class="by">${esc(c.by)}</div>`;
  if (type === 'quiz') return tag + `<h2>${esc(c.q)}</h2><div class="opts">` +
    c.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('') +
    `</div><p class="why">${esc(c.why)}</p>`;
  if (type === 'video') return tag + `<div class="frame ${c.short ? '' : 'wide'}" data-yt="${c.id}"></div>` +
    `<div class="vtitle">${esc(c.title || 'YouTube video')}</div>`;
  return tag + `<h2>${esc(c.title)}</h2>` + c.body.map((p) => `<p>${p}</p>`).join('') +
    `<div class="check">Check it: ${esc(c.check)}</div>`;
}

const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    const el = e.target, frame = el.querySelector('.frame');
    if (e.isIntersecting) {
      if (el.dataset.key && !seen.has(el.dataset.key)) { seen.add(el.dataset.key); store.set('seen', [...seen]); }
      if (frame && !frame.firstChild) {
        const f = document.createElement('iframe');
        f.src = `https://www.youtube-nocookie.com/embed/${frame.dataset.yt}?playsinline=1&rel=0`;
        f.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share';
        f.allowFullscreen = true; f.referrerPolicy = 'strict-origin-when-cross-origin';
        frame.appendChild(f);
      }
    } else if (frame) frame.replaceChildren();   // unload to stop playback
  });
}, { root: feed, threshold: 0.6 });

function render() {
  io.disconnect();
  const q = buildQueue();
  feed.innerHTML = '';
  q.forEach((c) => {
    const s = document.createElement('section');
    s.className = 'card'; s.dataset.key = c.key; s.style.setProperty('--c', `var(--${c.type === 'video' ? 'video' : c.t})`);
    s.innerHTML = cardHtml(c);
    if (c.type === 'quiz') s.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
      if (s.classList.contains('answered')) return;
      s.classList.add('answered');
      b.classList.add(+b.dataset.i === c.a ? 'right' : 'wrong');
      s.querySelectorAll('.opt')[c.a].classList.add('right');
    });
    feed.appendChild(s); io.observe(s);
  });
  const end = document.createElement('section');
  end.className = 'card end';
  end.innerHTML = q.length
    ? '<h2>That\'s everything.</h2><p>The feed ends on purpose. Go build the thing.</p>'
    : '<h2>No topics selected.</h2><p>Turn one on above.</p>';
  feed.appendChild(end);
  feed.scrollTop = 0;
}

function renderChips() {
  const chips = $('#chips'); chips.innerHTML = '';
  Object.entries(TOPICS).forEach(([k, name]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (enabled.includes(k) ? ' on' : ''); b.textContent = name;
    b.style.setProperty('--c', `var(--${k})`);
    b.onclick = () => {
      enabled = enabled.includes(k) ? enabled.filter((x) => x !== k) : [...enabled, k];
      store.set('topics', enabled); renderChips(); render();
    };
    chips.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'chip tool'; add.textContent = '+ Videos'; add.onclick = () => $('#dlg').showModal();
  const reset = document.createElement('button');
  reset.className = 'chip tool'; reset.textContent = 'Restart';
  reset.onclick = () => { seen = new Set(); store.set('seen', []); render(); };
  chips.append(add, reset);
}

// ── Videos ──
$('#vtopic').innerHTML = Object.entries(TOPICS).map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
$('#key').value = store.get('key', '');
const say = (m) => { $('#msg').textContent = m; };
function addVideo(v) { if (videos.some((x) => x.id === v.id)) return false; videos.push(v); store.set('videos', videos); return true; }

$('#addBtn').onclick = () => {
  const p = ytId($('#url').value.trim());
  if (!p) return say('That does not look like a YouTube link.');
  say(addVideo({ ...p, t: $('#vtopic').value, title: '' }) ? 'Added.' : 'Already in your feed.');
  $('#url').value = ''; render();
};
$('#closeBtn').onclick = () => $('#dlg').close();

$('#fetchBtn').onclick = async () => {
  const key = $('#key').value.trim();
  if (!key) return say('Paste an API key first.');
  store.set('key', key);
  const api = (path, q) => fetch(`https://www.googleapis.com/youtube/v3/${path}?${new URLSearchParams({ ...q, key })}`)
    .then((r) => r.ok ? r.json() : Promise.reject(new Error(path + ' ' + r.status)));
  let added = 0, failed = 0;
  say('Fetching…');
  for (const ch of CHANNELS) {
    try {
      const c = await api('channels', { part: 'id', forHandle: '@' + ch.h });
      const cid = c.items && c.items[0] && c.items[0].id;
      if (!cid) throw new Error('no channel');
      // "UUSH…" is the channel's Shorts-only playlist; fall back to all uploads ("UU…").
      let items, short = true;
      try { items = (await api('playlistItems', { part: 'snippet', maxResults: 5, playlistId: 'UUSH' + cid.slice(2) })).items; }
      catch { short = false; items = (await api('playlistItems', { part: 'snippet', maxResults: 5, playlistId: 'UU' + cid.slice(2) })).items; }
      (items || []).forEach((it) => {
        if (addVideo({ id: it.snippet.resourceId.videoId, short, t: ch.t, title: `${it.snippet.title} — ${it.snippet.channelTitle}` })) added++;
      });
    } catch { failed++; }
  }
  say(`Added ${added} videos.` + (failed ? ` ${failed} channel(s) failed.` : ''));
  render();
};

renderChips(); render();
</script>
</body>
</html>
